version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  api:
    build: .
    container_name: url_shortener_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - app_network

  localstack:
    image: localstack/localstack:3.4
    container_name: url_shortener_localstack
    ports:
      - "4566:4566"
    environment:
      - DEBUG=0
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  redis_data:
